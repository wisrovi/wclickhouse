services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: wclickhouse-test-db
    ports:
      - "8124:8123"
      - "9001:9000"
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=test_pass
      - CLICKHOUSE_DB=test_db
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
